<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Al-Jazeera-Arabic';src:url('../../aljazeera-bold.ttf') format('truetype');font-weight:100 900;font-display:block;}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<canvas id="cv" width="1080" height="1920"></canvas>
<script>
/* ═══ أغلفة المراسيل — نظام تصميم + توليد دفعة ═══
   شبكة: هوامش 80 · منطقة آمنة y 300–1600 (قصّ الشبكة 4:5 = 285–1635) · مسافات بمضاعفات 8
   تسلسل: عنوان (1) ← منتج/صورة (2) ← معلومة داعمة (3) ← شعار صغير ثابت (4)
   مقاسات: عنوان ≤180 · فرعي 72–96 · نص 44 · وسم 36 · الشعار 52 دائماً */
const C=document.getElementById('cv'), X=C.getContext('2d');
const BG='#0E1524', ACC='#2E74E6', SC='#3A2378', SH='rgba(46,24,104,0.62)', FONT="'Al-Jazeera-Arabic'";
const IMG={}; function load(k,src){return new Promise(r=>{const i=new Image();i.onload=()=>{IMG[k]=i;r();};i.onerror=()=>{console.error('img '+src);r();};i.src=src;});}
const lp=(a,b,k)=>a+(b-a)*k, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rgba(h,a){const n=parseInt(h.replace('#',''),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function mix(h1,h2,k){const f=h=>{const n=parseInt(h.replace('#',''),16);return[n>>16&255,n>>8&255,n&255];};const a=f(h1),b=f(h2);return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(',')})`;}
function rrect(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
const ISO=s=>s.replace(/(\d+%?)/g,'⁦$1⁩');      // الأرقام داخل العربي معزولة الاتجاه
function tw(s,size){X.save();X.font='900 '+size+'px '+FONT;X.direction='rtl';const v=X.measureText(ISO(s)).width;X.restore();return v;}
function fit(s,size,max){while(tw(s,size)>max&&size>40)size-=2;return size;}
function txt(s,x,y,size,o){o=o||{};s=ISO(s);X.save();X.font='900 '+size+'px '+FONT;X.textAlign=o.al||'center';X.textBaseline='middle';X.direction='rtl';
  if(o.stroke!==0){X.shadowColor=SH;X.shadowBlur=o.sh??Math.round(size*0.18);X.shadowOffsetY=Math.round(size*0.04);X.lineJoin='round';X.lineWidth=o.stroke||Math.max(3,Math.round(size*0.07));X.strokeStyle=SC;X.strokeText(s,x,y);X.shadowColor='transparent';}
  X.fillStyle=o.c||'#FFFFFF';X.fillText(s,x,y);X.restore();}
function pill(s,cx,cy,fs,fill,col,border){const w=tw(s,fs)+fs*1.5,h=Math.round(fs*1.9);
  X.save();X.shadowColor='rgba(0,0,0,0.4)';X.shadowBlur=24;X.shadowOffsetY=8;rrect(cx-w/2,cy-h/2,w,h,h/2);X.fillStyle=fill;X.fill();X.restore();
  if(border){X.save();rrect(cx-w/2,cy-h/2,w,h,h/2);X.lineWidth=3;X.strokeStyle=border;X.stroke();X.restore();}
  txt(s,cx,cy+2,fs,{c:col||'#FFFFFF',stroke:0});return w;}
function pillRow(items,cy,fs,fill){const ws=items.map(s=>tw(s,fs)+fs*1.5),g=24,tot=ws.reduce((a,b)=>a+b,0)+g*(items.length-1);let x=540+tot/2;items.forEach((s,i)=>{pill(s,x-ws[i]/2,cy,fs,fill||ACC);x-=ws[i]+g;});}
function cover(img,fx,fy,k,ax,ay,H){H=H||1920;const dw=img.width*k,dh=img.height*k;X.drawImage(img,clamp(ax-fx*dw,1080-dw,0),clamp(ay-fy*dh,H-dh,0),dw,dh);}
function vgrad(st,y0,y1){const g=X.createLinearGradient(0,y0||0,0,y1||1920);st.forEach(s=>g.addColorStop(s[0],s[1]));X.fillStyle=g;X.fillRect(0,y0||0,1080,(y1||1920)-(y0||0));}
const JOINF='بتثجحخسشصضطظعغفقكلمنهيئ';
function kash(w,n){let o='';const pre=w.startsWith('ال')?2:0;for(let i=0;i<w.length;i++){o+=w[i];const a=w[i],b=w[i+1];if(i>=pre&&b&&JOINF.includes(a)&&/[ء-ي]/.test(b)&&!(a==='ل'&&'اأإآ'.includes(b)))o+='ـ'.repeat(n);}return o;}

/* الشعار — نفس المقاس دائماً (52) · مكانه حسب القالب */
function brand(x,y,al){al=al||'center';txt('المراسيل',x,y,52,{al,stroke:4,sh:12});
  const bw=84,bx=al==='center'?x-bw/2:(al==='right'?x-bw:x);X.fillStyle=ACC;rrect(bx,y+36,bw,6,3);X.fill();
  txt('لتجارة المواد الأولية للمنظفات',x,y+70,26,{al,c:'rgba(255,255,255,0.82)',stroke:2,sh:6});}
/* المنتج على الدائرة الزرقاء */
function hero(cx,cy,R,bagH,rot){const bag=IMG.bag;
  const hg=X.createRadialGradient(cx,cy,R*0.6,cx,cy,R*1.65);hg.addColorStop(0,rgba(ACC,0.45));hg.addColorStop(1,rgba(ACC,0));X.fillStyle=hg;X.beginPath();X.arc(cx,cy,R*1.65,0,7);X.fill();
  const g=X.createRadialGradient(cx-R*0.3,cy-R*0.35,R*0.1,cx,cy,R);g.addColorStop(0,mix(ACC,'#FFFFFF',0.3));g.addColorStop(0.55,ACC);g.addColorStop(1,mix(ACC,BG,0.45));
  X.save();X.shadowColor=rgba(ACC,0.55);X.shadowBlur=70;X.fillStyle=g;X.beginPath();X.arc(cx,cy,R,0,7);X.fill();X.restore();
  X.save();X.strokeStyle='rgba(255,255,255,0.32)';X.lineWidth=3;X.beginPath();X.arc(cx,cy,R-7,0,7);X.stroke();X.restore();
  X.save();X.globalAlpha=0.55;X.strokeStyle='#FFFFFF';X.lineWidth=3;X.setLineDash([4,18]);X.beginPath();X.arc(cx,cy,R*1.14,0,7);X.stroke();X.restore();
  const bw=bagH*bag.width/bag.height;
  X.save();const sg=X.createRadialGradient(cx,cy+bagH*0.47,4,cx,cy+bagH*0.47,bw*0.55);sg.addColorStop(0,'rgba(0,0,0,0.65)');sg.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=sg;X.translate(cx,cy+bagH*0.47);X.scale(1,0.22);X.beginPath();X.arc(0,0,bw*0.55,0,7);X.fill();X.restore();
  X.save();X.translate(cx,cy);X.rotate(rot||-0.06);X.shadowColor='rgba(0,0,0,0.5)';X.shadowBlur=44;X.shadowOffsetY=20;X.drawImage(bag,-bw/2,-bagH/2,bw,bagH);X.restore();}
function sparkles(n,seed,x0,y0,x1,y1){let s=seed;const r=()=>{s=(s*9301+49297)%233280;return s/233280;};for(let i=0;i<n;i++){X.save();X.globalAlpha=lp(0.2,0.7,r());X.fillStyle='#FFF';X.shadowColor='#FFF';X.shadowBlur=8;X.beginPath();X.arc(lp(x0,x1,r()),lp(y0,y1,r()),lp(1.5,4,r()),0,7);X.fill();X.restore();}}

/* كتلة عنوان: كل سطر ياخذ مقاسه بنفسه · ارتفاع سطر عربي 1.18 · يرجّع أسفل الكتلة */
function head(t,cy,maxFs,maxW,o){o=o||{};const L=t.split('|');const fz=L.map(l=>fit(l,maxFs,maxW));let y=cy;
  L.forEach((l,i)=>{ if(i) y+=(fz[i-1]+fz[i])/2*1.25; txt(l,o.x||540,y,fz[i],{al:o.al||'center',c:(i===L.length-1&&L.length>1&&o.acc!==false)?ACC:'#FFFFFF',stroke:o.stroke}); });
  return y+fz[L.length-1]*0.62; }
const REAL=bg=>bg==='fork'||bg==='bags';    // خلفية فيها البانر الحقيقي ← بلا شعار إضافي
/* خلفيات */
const BGS={
  navy(){vgrad([[0,'#0A0F1C'],[0.45,'#132340'],[1,'#0A0F1C']]);X.save();X.globalAlpha=0.14;X.filter='blur(14px)';cover(IMG.pour,0.62,0.6,1.5,540,960);X.restore();sparkles(36,7,80,600,1000,1400);},
  pour(){cover(IMG.pour,0.62,0.45,1.2,540,900);vgrad([[0,rgba(BG,0.85)],[0.3,rgba(BG,0.55)],[0.65,rgba(BG,0.5)],[1,rgba(BG,0.92)]]);},
  flakes(){cover(IMG.pour,0.70,0.36,1.62,540,900);vgrad([[0,rgba(BG,0.88)],[0.3,rgba(BG,0.45)],[0.65,rgba(BG,0.55)],[1,rgba(BG,0.92)]]);},
  fork(){X.drawImage(IMG.fork,0,0,1080,1920);vgrad([[0,rgba(BG,0.92)],[0.35,rgba(BG,0.7)],[0.62,rgba(BG,0.3)],[0.7,rgba(BG,0)]],0,1350);},
  bags(){X.drawImage(IMG.bags,0,0,1080,1920);vgrad([[0,rgba(BG,0.9)],[0.35,rgba(BG,0.65)],[0.62,rgba(BG,0.3)],[0.7,rgba(BG,0)]],0,1350);},
};
/* عناوين — سطر أو سطرين (|) · المطلوب كله من كلام الفيديو أو منك */
const HEADS={
  k:{t:'كوستك صودا',big:'كوستك|صودا'}, b:{t:'بطش 99',big:'بطش|99'}, p:{t:'تركيز 99%',big:'تركيز|99%',facts:['قشور','نقاوة عالية','25 كغ']},
  c:{t:kash('تحرق',2)+' إيدك|وتصنع|صابون صلب!'},
  q:{t:'كيف يصنع|'+kash('الصابون',1)+' الصلب؟'},
  h:{t:'حاوية جديدة|وصلت!'},
};
const FACTS0=['قشور','تركيز 99%','25 كغ']; const F=h=>h.facts||FACTS0;

/* ── القوالب ── */
function L1(h,bg){ // المنتج في المنتصف
  BGS[bg](); brand(540,360);
  head(h.t.split('|')[0],535,176,880);
  hero(540,965,290,620,-0.06);
  pillRow(F(h),1390,42); txt('مادة أولية للمنظفات',540,1490,40,{c:'rgba(255,255,255,0.88)'});}
function L2(h,bg){ // عنوان ضخم: كلمتين فوق بعض + منتج + شعار تحت
  BGS[bg]();
  const t=h.big||h.t, hb=head(t,h.big?560:520,h.big?260:165,900);
  X.fillStyle=ACC;rrect(540-90,hb+30,180,10,5);X.fill();
  const R=215, cy=Math.min(1235,hb+110+R*1.1); hero(540,cy,R,470,-0.06); brand(540,1495);}
function L3(h,bg){ // تقسيم مائل: صورة فوق · كحلي تحت
  X.save();X.beginPath();X.moveTo(0,0);X.lineTo(1080,0);X.lineTo(1080,1000);X.lineTo(0,920);X.closePath();X.clip();BGS[bg]();X.restore();
  X.save();X.beginPath();X.moveTo(0,920);X.lineTo(1080,1000);X.lineTo(1080,1920);X.lineTo(0,1920);X.closePath();X.clip();vgrad([[0,'#132340'],[1,'#0A0F1C']],920,1920);X.restore();
  X.save();X.strokeStyle=ACC;X.lineWidth=10;X.beginPath();X.moveTo(0,920);X.lineTo(1080,1000);X.stroke();X.restore();
  if(!REAL(bg)) brand(540,360);
  const hb=head(h.t,1140,170,880); pillRow(F(h),hb+100,42);}
function L4(h,bg){ // الرقم
  BGS[bg](); brand(540,360); head(h.t,555,128,860);
  const cx=540,cy=975,R=245;
  X.save();X.shadowColor='rgba(0,0,0,0.5)';X.shadowBlur=50;X.fillStyle=rgba(BG,0.82);X.beginPath();X.arc(cx,cy,R+52,0,7);X.fill();X.restore();
  X.lineCap='round';X.lineWidth=30;X.strokeStyle='rgba(255,255,255,0.14)';X.beginPath();X.arc(cx,cy,R,0,7);X.stroke();
  const a0=-Math.PI/2;X.save();X.shadowColor=ACC;X.shadowBlur=34;X.strokeStyle=ACC;X.beginPath();X.arc(cx,cy,R,a0,a0+Math.PI*2*0.99);X.stroke();X.restore();
  for(let i=0;i<60;i++){const an=a0+i/60*Math.PI*2,r1=R+36,r2=R+(i%5?42:50);X.strokeStyle='rgba(255,255,255,0.5)';X.lineWidth=3;X.beginPath();X.moveTo(cx+r1*Math.cos(an),cy+r1*Math.sin(an));X.lineTo(cx+r2*Math.cos(an),cy+r2*Math.sin(an));X.stroke();}
  txt('تركيز',cx,cy-100,50,{c:'rgba(255,255,255,0.85)',stroke:3});
  X.save();X.font='900 200px '+FONT;X.textAlign='center';X.textBaseline='middle';X.direction='ltr';X.shadowColor=rgba(ACC,0.8);X.shadowBlur=34;X.fillStyle='#FFF';X.fillText('99%',cx,cy+26);X.restore();
  pill('نقاوة عالية جداً',540,1385,52,ACC); txt('قشور · مادة أولية للمنظفات',540,1495,40,{c:'rgba(255,255,255,0.88)'});}
function L5(h,bg){ // شريط تحريري
  BGS[bg](); if(!REAL(bg)) brand(540,360);
  const L=h.t.split('|'), fz=L.map(l=>fit(l,140,820)); let th=fz[0]; for(let i=1;i<L.length;i++) th+=(fz[i-1]+fz[i])/2*1.25;
  const bh=th+110, y=(REAL(bg)?820:900)-bh/2;
  X.fillStyle=rgba(BG,0.95);X.fillRect(0,y,1080,bh);
  X.save();X.beginPath();X.rect(0,y,120,bh);X.clip();for(let x=-bh-64;x<220;x+=64){X.fillStyle=ACC;X.beginPath();X.moveTo(x,y+bh);X.lineTo(x+32,y+bh);X.lineTo(x+32+bh,y);X.lineTo(x+bh,y);X.closePath();X.fill();}X.restore();
  X.fillStyle=ACC;X.fillRect(1056,y,24,bh);
  head(h.t,y+55+fz[0]/2,140,820,{x:1000,al:'right',stroke:0});
  pill('كوستك صودا · قشور · 99%',540,y+bh+110,42,rgba(BG,0.9),'#FFF',ACC);}
function L6(h,bg){ // لقطة الفيديو + البانر الحقيقي (بلا شعار إضافي)
  BGS[bg](); const hb=head(h.t,545,160,900); pillRow(F(h),hb+100,42);}

/* ── الدفعة: مرتّبة حسب القالب ── */
const PLAN=[
 ['L1','k','navy'],['L1','b','navy'],['L1','p','navy'],['L1','k','pour'],['L1','b','pour'],
 ['L2','k','navy'],['L2','b','navy'],['L2','c','navy'],['L2','h','pour'],['L2','q','pour'],
 ['L3','k','pour'],['L3','b','pour'],['L3','h','fork'],['L3','c','flakes'],['L3','q','bags'],
 ['L4','k','pour'],['L4','b','pour'],['L4','k','navy'],['L4','b','navy'],
 ['L5','c','flakes'],['L5','k','pour'],['L5','b','fork'],['L5','q','bags'],['L5','h','fork'],
 ['L6','q','fork'],['L6','h','fork'],['L6','b','fork'],['L6','k','bags'],['L6','c','bags'],['L6','b','bags'],
];
const TPL={L1,L2,L3,L4,L5,L6};
window.PLAN=PLAN;
window.draw=i=>{const [t,h,bg]=PLAN[i];X.clearRect(0,0,1080,1920);X.save();TPL[t](HEADS[h],bg);X.restore();return C.toDataURL('image/png');};
window.READY=Promise.all([document.fonts.load("900 100px 'Al-Jazeera-Arabic'",'عربي ـ 99%'),load('bag','../../assets/packshot_cut.png'),load('pour','../../assets/product.jpeg'),load('fork','bg_3.7.jpg'),load('bags','bg_26.6.jpg')]).then(()=>document.fonts.ready);
</script></body></html>
