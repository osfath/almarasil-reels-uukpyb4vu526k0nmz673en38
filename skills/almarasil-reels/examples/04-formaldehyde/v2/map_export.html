<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8">
<style>@font-face{font-family:'AJ';src:url('../aljazeera-bold.ttf');font-weight:100 900;}
@font-face{font-family:'AJ';src:local('Arial Black'),local('Arial Bold');unicode-range:U+0041-005A,U+0061-007A;font-weight:100 900;}
body{margin:0;background:transparent}</style></head><body><canvas id="cv"></canvas>
<script src="../assets/map/map.js"></script>
<script>
/* خريطة شركة المراسيل — PNG بلا خلفية (نفس رسم الفيديو، دقة ×2) · ?card=1 = مع كرت أبيض */
const CARD=location.search.includes('card=1'), K=2, W0=960, H0=820, C=document.getElementById('cv'); C.width=W0*K; C.height=H0*K; const X=C.getContext('2d'); X.scale(K,K);
const ACC='#2E74E6', PURP='#6B4BC2', NAVY='#0E1524', INKD='#16213A', F="'AJ'";
const MS=2.1, MC=[-162,-140]; const mp=q=>[480+(q[0]-MC[0])*MS, 410-(q[1]-MC[1])*MS];
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
function txt(s,x,y,fs,c,al,ltr){X.save();X.font='900 '+fs+'px '+F;X.textAlign=al||'center';X.textBaseline='middle';X.direction=ltr?'ltr':'rtl';X.fillStyle=c;X.fillText(s,x,y);X.restore();}
function tw(s,fs){X.save();X.font='900 '+fs+'px '+F;X.direction='rtl';const w=X.measureText(s).width;X.restore();return w;}
function poly(p){X.beginPath();X.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)X.lineTo(p[i][0],p[i][1]);}
function pill(s,x,y,fs,f,c){const w=tw(s,fs)+fs*1.2,h=fs*1.9;X.save();X.shadowColor='rgba(14,21,36,0.18)';X.shadowBlur=16;X.shadowOffsetY=5;rr(x-w/2,y-h/2,w,h,h/2);X.fillStyle=f;X.fill();X.restore();txt(s,x,y+2,fs,c);}
document.fonts.load("900 40px 'AJ'",'عربي').then(()=>document.fonts.ready).then(()=>{ const M=window.MAPD;
  X.save(); rr(0,0,W0,H0,30); X.clip(); if(CARD){ X.fillStyle='#FFFFFF'; X.fillRect(0,0,W0,H0); }
  [['svc','#E6EBF5',9],['res','#DFE5F2',13],['silo','#DFE5F2',15],['main','#CCD8F2',26]].forEach(([k,c,lw])=>{ X.strokeStyle=CARD?c:c.replace('#DFE5F2','#C7D1E8').replace('#E6EBF5','#D3DBEE').replace('#CCD8F2','#B4C4EA'); X.lineWidth=lw; X.lineCap='round'; X.lineJoin='round'; M.roads.filter(r=>r.k===k).forEach(r=>{ poly(r.p.map(mp)); X.stroke(); }); });
  X.save(); X.strokeStyle=PURP; X.lineWidth=14; X.lineCap='round'; X.shadowColor='rgba(107,75,194,0.6)'; X.shadowBlur=18; M.roads.filter(r=>r.k==='silo').forEach(r=>{ poly(r.p.map(mp)); X.stroke(); }); X.restore();
  const R=M.route.map(mp); X.lineCap='round'; X.lineJoin='round'; poly(R); X.strokeStyle='#FFFFFF'; X.lineWidth=22; X.stroke(); poly(R); X.strokeStyle=ACC; X.lineWidth=12; X.stroke();
  const rb=mp([0,0]); X.fillStyle='#FFFFFF'; X.strokeStyle=NAVY; X.lineWidth=8; X.beginPath(); X.arc(rb[0],rb[1],20,0,7); X.fill(); X.stroke(); X.fillStyle=NAVY; X.beginPath(); X.arc(rb[0],rb[1],7,0,7); X.fill();
  pill('دورة الحماميل',rb[0]-50,rb[1]+70,32,NAVY,'#FFFFFF');
  const sp=mp([-198,-156]); pill('شارع السايلو',sp[0],sp[1],34,PURP,'#FFFFFF');
  const co=mp(M.company); X.save(); X.translate(co[0],co[1]); X.shadowColor='rgba(46,116,230,0.6)'; X.shadowBlur=20; X.fillStyle=ACC; X.beginPath(); X.moveTo(0,0); X.bezierCurveTo(-16,-30,-40,-48,-40,-80); X.arc(0,-80,40,Math.PI,0); X.bezierCurveTo(40,-48,16,-30,0,0); X.closePath(); X.fill(); X.shadowBlur=0; X.fillStyle='#FFFFFF'; X.beginPath(); X.arc(0,-80,15,0,7); X.fill(); X.restore();
  const cx=co[0]+48, cw=400, ch=118, cy0=co[1]-140; X.save(); X.shadowColor='rgba(14,21,36,0.18)'; X.shadowBlur=20; X.shadowOffsetY=6; rr(cx,cy0,cw,ch,22); X.fillStyle='#FFFFFF'; X.fill(); X.restore();
  X.strokeStyle='rgba(46,116,230,0.5)'; X.lineWidth=3; rr(cx,cy0,cw,ch,22); X.stroke(); X.fillStyle=ACC; X.fillRect(cx+cw-8,cy0+18,8,ch-36);
  txt('شركة المراسيل',cx+cw-30,cy0+40,40,INKD,'right'); txt('قرب ورش الألمنيوم والبلاستيك',cx+cw-30,cy0+88,27,PURP,'right');
  X.restore(); txt('© OpenStreetMap',24,H0-22,18,'rgba(22,33,58,0.6)','left',1);
  if(CARD){ X.strokeStyle='rgba(107,75,194,0.25)'; X.lineWidth=3; rr(1.5,1.5,W0-3,H0-3,30); X.stroke(); }
  window.DONE=true; });
</script></body></html>
