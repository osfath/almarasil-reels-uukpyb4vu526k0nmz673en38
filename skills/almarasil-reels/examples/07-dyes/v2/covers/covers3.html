<canvas id="cv" width="1080" height="1920"></canvas>
<script>
/* ═══ أغلفة «فورمالين كيمانول 37%» — لغة Promax (فلات تحريري) ═══
   ⛔ لا توهّج ولا زجاج ولا دوائر · ⛔ لا خط تحت الشعار · كتل صلبة بزوايا حادة · باليت المراسيل + خط الجزيرة
   منطقة آمنة: قصّ الشبكة 4:5 = y 285–1635 · الشعار ≥ 360 · العنوان ≥ 520 · هوامش ≥ 80
   النص كله من كلامه («الفورمالين وصل · من مصنع كيمانول السعودي · تركيز 37% · جودة ممتازة · جليكانات 32 كيلو ونص»)
   أو من الأصول الحقيقية (صورة الجليكان · شعار وجدول TDS · لقطات التصوير). */
const C=document.getElementById('cv'), X=C.getContext('2d');
const NAVY='#0E1524', INKD='#16213A', ACC='#2E74E6', ACCT='#4FA3FF', PURP='#6B4BC2', SC='#3A2378', SH='rgba(46,24,104,0.62)', FONT="'Al-Jazeera-Arabic'";
const IMG={}; function load(k,src){return new Promise(r=>{const i=new Image();i.onload=()=>{IMG[k]=i;r();};i.onerror=()=>{console.error('img '+src);r();};i.src=src;});}
const lp=(a,b,k)=>a+(b-a)*k, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rgba(h,a){const n=parseInt(h.replace('#',''),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
const ISO=s=>String(s).replace(/(\d[\d\-.]*\d%?|\d%?)/g,'⁦$1⁩');
function tw(s,size){X.save();X.font='900 '+size+'px '+FONT;X.direction='rtl';const v=X.measureText(ISO(s)).width;X.restore();return v;}
function fit(s,size,max){while(tw(s,size)>max&&size>40)size-=2;return size;}
/* نص: بلا حدّ على الصفحة البيضاء · حدّ بنفسجي رفيع + ظل ناعم فوق الصور (نفس الكابشن) */
function txt(s,x,y,size,o){o=o||{};s=ISO(s);X.save();X.font='900 '+size+'px '+FONT;X.textAlign=o.al||'center';X.textBaseline='middle';X.direction=o.ltr?'ltr':'rtl';
  if(o.stroke){X.shadowColor=SH;X.shadowBlur=Math.round(size*0.2);X.shadowOffsetY=Math.round(size*0.05);X.lineJoin='round';X.lineWidth=Math.max(4,Math.round(size*0.085));X.strokeStyle=SC;X.strokeText(s,x,y);X.shadowColor='transparent';}
  X.fillStyle=o.c||'#FFFFFF';X.fillText(s,x,y);X.restore();}
/* لاتيني/أرقام موسّطة بحدود الحروف الفعلية */
function ltrBox(s,cx,cy,fs,col){X.save();X.font='900 '+fs+'px '+FONT;X.direction='ltr';X.textAlign='left';X.textBaseline='alphabetic';
  const m=X.measureText(s),w=m.actualBoundingBoxLeft+m.actualBoundingBoxRight,h=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;
  X.fillStyle=col;X.fillText(s,cx-w/2+m.actualBoundingBoxLeft,cy+h/2-m.actualBoundingBoxDescent);X.restore();return [w,h];}
function ltrSize(s,fs){X.save();X.font='900 '+fs+'px '+FONT;X.direction='ltr';const m=X.measureText(s);X.restore();return [m.actualBoundingBoxLeft+m.actualBoundingBoxRight,m.actualBoundingBoxAscent+m.actualBoundingBoxDescent];}
const JOINF='بتثجحخسشصضطظعغفقكلمنهيئ';
function kash(w,n){let o='';const pre=w.startsWith('ال')?2:0;const sl=[];for(let i=pre;i<w.length-1;i++){const a=w[i],b=w[i+1];if(JOINF.includes(a)&&/[ء-ي]/.test(b)&&!(a==='ل'&&'اأإآ'.includes(b)))sl.push(i);}
  const S=sl.length>3?[sl[0],sl[Math.floor(sl.length/2)],sl[sl.length-1]]:sl;for(let i=0;i<w.length;i++){o+=w[i];if(S.includes(i))o+='ـ'.repeat(n);}return o;}
function vgrad(st,y0,y1){const g=X.createLinearGradient(0,y0,0,y1);st.forEach(s=>g.addColorStop(s[0],s[1]));X.fillStyle=g;X.fillRect(0,y0,1080,y1-y0);}

/* ── الخلفيات ── */
function page(){ vgrad([[0,'#F9FBFF'],[1,'#EEF2FB']],0,1920);
  for(let x=60;x<1080;x+=60){const maj=x%240===60;X.strokeStyle=rgba(maj?PURP:ACC,maj?0.16:0.08);X.lineWidth=maj?2:1;X.beginPath();X.moveTo(x,0);X.lineTo(x,1920);X.stroke();}
  for(let y=60;y<1920;y+=60){const maj=y%240===60;X.strokeStyle=rgba(maj?PURP:ACC,maj?0.16:0.08);X.lineWidth=maj?2:1;X.beginPath();X.moveTo(0,y);X.lineTo(1080,y);X.stroke();} }
function corners(y0,y1,c){X.strokeStyle=c||PURP;X.lineWidth=4;[[90,y0,1],[990,y0,-1],[90,y1,1],[990,y1,-1]].forEach(([x,y,s],i)=>{const dy=i<2?1:-1;X.beginPath();X.moveTo(x,y+36*dy);X.lineTo(x,y);X.lineTo(x+36*s,y);X.stroke();});}
function navyBg(){ vgrad([[0,'#0A0F1C'],[0.5,'#132340'],[1,'#0A0F1C']],0,1920);
  for(let x=60;x<1080;x+=60){X.strokeStyle='rgba(255,255,255,'+(x%240===60?0.07:0.035)+')';X.lineWidth=x%240===60?2:1;X.beginPath();X.moveTo(x,0);X.lineTo(x,1920);X.stroke();}
  for(let y=60;y<1920;y+=60){X.strokeStyle='rgba(255,255,255,'+(y%240===60?0.07:0.035)+')';X.lineWidth=y%240===60?2:1;X.beginPath();X.moveTo(0,y);X.lineTo(1080,y);X.stroke();} }
function photo(k,dark){ X.drawImage(IMG[k],0,0,1080,1920); vgrad([[0,rgba(NAVY,dark||0.78)],[0.45,rgba(NAVY,0.25)],[0.62,rgba(NAVY,0)]],0,1100); }   // البانر الحقيقي يبقى كما هو (بلا شعار إضافي)
/* ── الهوية: هيدر الصفحة (بلا خط تحت الشعار) ── */
function header(y,dark){ txt('المراسيل',540,y,96,{c:dark?'#FFFFFF':PURP}); txt('لتجارة المواد الأولية للمنظفات',540,y+80,34,{c:dark?ACCT:ACC}); }
function brandSmall(y){ txt('المراسيل',540,y,52,{c:PURP}); txt('لتجارة المواد الأولية للمنظفات',540,y+46,24,{c:ACC}); }
/* ── مكوّنات فلات ── */
function bar(s,xR,y,fs,fill,col){ const w=tw(s,fs)+fs*1.1, h=Math.round(fs*1.42); X.fillStyle=fill;X.fillRect(xR-w,y,w,h); txt(s,xR-fs*0.55,y+h/2+fs*0.05,fs,{al:'right',c:col||'#FFFFFF'}); return [w,h]; }
function barC(s,cx,y,fs,fill,col){ const w=tw(s,fs)+fs*1.1; return bar(s,cx+w/2,y,fs,fill,col); }
function numBlock(s,x,y,fs,fill,edge){ const [w,h]=ltrSize(s,fs), bw=w+fs*0.7, bh=h+fs*0.62; X.fillStyle=fill||NAVY;X.fillRect(x,y,bw,bh); X.fillStyle=edge||ACC;X.fillRect(x,y,Math.max(8,fs*0.07),bh); ltrBox(s,x+bw/2+fs*0.035,y+bh/2,fs,'#FFFFFF'); return [bw,bh]; }
function arrived(xR,y,s,fs){ const h=Math.round(fs*1.66), sq=h, w=tw(s,fs)+fs*1.25; X.fillStyle=NAVY;X.fillRect(xR-sq,y,sq,h);
  const cx=xR-sq/2, cy=y+h/2, k=h/120; X.strokeStyle='#FFFFFF';X.lineWidth=7*k;X.lineJoin='miter';X.lineCap='square';X.strokeRect(cx-26*k,cy-4*k,52*k,34*k);X.beginPath();X.moveTo(cx,cy-38*k);X.lineTo(cx,cy+8*k);X.moveTo(cx-14*k,cy-6*k);X.lineTo(cx,cy+8*k);X.lineTo(cx+14*k,cy-6*k);X.stroke();
  const x=xR-sq-w; X.fillStyle='#FFFFFF';X.fillRect(x,y,w,h);X.fillStyle=ACC;X.fillRect(x,y+h-8*k,w,8*k); txt(s,xR-sq-fs*0.62,y+h/2+fs*0.05,fs,{al:'right',c:NAVY}); return [w+sq,h]; }
function can(cx,yTop,H){ const im=IMG.can, W=H*im.width/im.height; X.save();X.fillStyle='rgba(14,21,36,0.14)';X.beginPath();X.ellipse(cx,yTop+H-6,W*0.42,H*0.022,0,0,7);X.fill();X.restore(); X.drawImage(im,cx-W/2,yTop,W,H); return [cx-W/2,yTop,W,H]; }
function chips(items,cy,fs,dark){ const g=20, ws=items.map(s=>tw(s,fs)+fs*1.2), tot=ws.reduce((a,b)=>a+b,0)+g*(items.length-1); let x=540+tot/2; const h=Math.round(fs*1.9);
  items.forEach((s,i)=>{ X.fillStyle=dark?'#FFFFFF':NAVY; X.fillRect(x-ws[i],cy-h/2,ws[i],h); X.fillStyle=ACC; X.fillRect(x-ws[i],cy+h/2-6,ws[i],6); txt(s,x-ws[i]/2,cy+fs*0.05,fs,{c:dark?NAVY:'#FFFFFF'}); x-=ws[i]+g; }); }
function underline(cx,y,w,c){ X.fillStyle=c||ACC; X.fillRect(cx-w/2,y,w,10); }
function tds(x,y,w,dark){ const im=IMG.tds, h=w*im.height/im.width, pad=22;
  X.fillStyle='#FFFFFF';X.fillRect(x-pad,y-pad,w+2*pad,h+2*pad); X.strokeStyle=rgba(PURP,0.35);X.lineWidth=3;X.strokeRect(x-pad,y-pad,w+2*pad,h+2*pad); X.fillStyle=ACC;X.fillRect(x-pad,y-pad,w+2*pad,8);
  X.drawImage(im,x,y,w,h); const ry=y+h*208/510, rh=h*71/510; X.fillStyle=rgba(ACC,0.16);X.fillRect(x+w*17/1830,ry,w*1772/1830,rh); X.fillStyle=ACC;X.fillRect(x+w*17/1830,ry+rh-5,w*1772/1830,5);
  txt('CHEMANOL  TDS',x+w+pad,y+h+pad+30,22,{ltr:1,al:'right',c:dark?'rgba(255,255,255,0.6)':rgba(INKD,0.55)}); return h+2*pad; }

/* دائرة المنتج بأسلوب PIP الكوستك: دائرة زرقاء متدرّجة + حلقة داخلية + حلقة منقّطة + هالة خفيفة */
function heroCircle(cx,cy,R){ const hg=X.createRadialGradient(cx,cy,R*0.7,cx,cy,R*1.5); hg.addColorStop(0,rgba(ACC,0.35)); hg.addColorStop(1,rgba(ACC,0)); X.fillStyle=hg; X.beginPath(); X.arc(cx,cy,R*1.5,0,7); X.fill();
  const g=X.createRadialGradient(cx-R*0.3,cy-R*0.35,R*0.1,cx,cy,R); g.addColorStop(0,'#5B93EE'); g.addColorStop(0.55,ACC); g.addColorStop(1,'#1F4C9C');
  X.fillStyle=g; X.beginPath(); X.arc(cx,cy,R,0,7); X.fill();
  X.strokeStyle='rgba(255,255,255,0.32)'; X.lineWidth=3; X.beginPath(); X.arc(cx,cy,R-8,0,7); X.stroke();
  X.save(); X.globalAlpha=0.6; X.strokeStyle='#FFFFFF'; X.lineWidth=4; X.lineCap='round'; X.setLineDash([2,16]); X.beginPath(); X.arc(cx,cy,R*1.14,0,7); X.stroke(); X.restore(); }
/* شارة بخط إشارة لموضع على الملصق */
function callout(s,pt,pc,side){ const fs=44, w=tw(s,fs)+fs*1.4, h=Math.round(fs*1.9), ex=side==='r'?pc[0]+w/2-10:pc[0]-w/2+10;
  X.strokeStyle='rgba(255,255,255,0.85)'; X.lineWidth=3; X.beginPath(); X.moveTo(ex,pc[1]); X.lineTo(pt[0],pt[1]); X.stroke();
  X.fillStyle=ACC; X.strokeStyle='#FFFFFF'; X.lineWidth=4; X.beginPath(); X.arc(pt[0],pt[1],11,0,7); X.fill(); X.stroke();
  X.fillStyle=ACC; X.beginPath(); X.roundRect(pc[0]-w/2,pc[1]-h/2,w,h,h/2); X.fill(); txt(s,pc[0],pc[1]+fs*0.05,fs,{c:'#FFFFFF'}); }
/* ═══ الأغلفة العشرة — كل واحد زاوية جذب مختلفة ═══ */
const YEL='#F7CC2F', VIOL='#8E73D6';
/* صورة كبيرة بتركيز وزوم: النقطة (fx,fy) من الصورة تجي على (ax,ay) بالشاشة */
function photoZ(im,fx,fy,zoom,ax,ay,clip){ const sc=zoom*1080/im.width, w=im.width*sc, h=im.height*sc; let x=ax-fx*w, y=ay-fy*h;
  x=clamp(x,1080-w,0); y=clamp(y,1920-h,0); X.save(); if(clip){ X.beginPath(); X.rect(clip[0],clip[1],clip[2],clip[3]); X.clip(); } X.drawImage(im,x,y,w,h); X.restore(); }
function grade(top,bot){ vgrad([[0,rgba(NAVY,top)],[0.38,rgba(NAVY,top*0.25)],[0.62,rgba(NAVY,0)],[0.82,rgba(NAVY,bot*0.6)],[1,rgba(NAVY,bot)]],0,1920); }
function brandPlate(y){ txt('المراسيل',540,y,78,{c:'#FFFFFF',stroke:1}); txt('لتجارة المواد الأولية للمنظفات',540,y+64,30,{c:ACCT,stroke:1}); }
function dyeGrad(x0,x1){ const g=X.createLinearGradient(x0,0,x1,0); ['#2E5BD8','#6B3FD0','#E0213A','#D6336C','#C9E62F','#33D15A'].forEach((c,i,a)=>g.addColorStop(i/(a.length-1),c)); return g; }
function canP(im,cx,cy,H){ const W=H*im.width/im.height; X.save(); X.fillStyle='rgba(14,21,36,0.22)'; X.beginPath(); X.ellipse(cx,cy+H/2-6,W*0.42,H*0.025,0,0,7); X.fill(); X.restore(); X.drawImage(im,cx-W/2,cy-H/2,W,H); return [cx-W/2,cy-H/2,W,H]; }
function cloud(cx,cy,R,col,col2){ const C=[[0,0,1],[0.42,-0.30,0.62],[-0.45,-0.22,0.66],[0.30,0.42,0.6],[-0.36,0.40,0.58],[0.02,-0.55,0.5],[0.62,0.10,0.45],[-0.64,0.06,0.47]];
  X.save(); X.translate(cx,cy); X.fillStyle=col; X.beginPath(); C.forEach(([x,y,s])=>{ X.moveTo(x*R+s*R*0.62,y*R); X.arc(x*R,y*R,s*R*0.62,0,7); }); X.fill();
  X.fillStyle=col2; X.beginPath(); [[0.18,-0.18,0.55],[-0.22,0.12,0.42],[0.30,0.22,0.3]].forEach(([x,y,s])=>{ X.moveTo(x*R+s*R*0.62,y*R); X.arc(x*R,y*R,s*R*0.62,0,7); }); X.fill(); X.restore();
  let s=11; const r=()=>{s=(s*9301+49297)%233280;return s/233280;}; for(let i=0;i<46;i++){ const a=r()*7, d=R*(0.95+r()*0.55), sz=3+r()*11, px=cx+Math.cos(a)*d, py=cy+Math.sin(a)*d*0.92; X.fillStyle=[col,col2,NAVY][i%3]; if(i%4===0) X.fillRect(px-sz/2,py-sz/2,sz,sz); else { X.beginPath(); X.arc(px,py,sz/2,0,7); X.fill(); } } }
function card(im,fx,fy,zoom,x,y,w,h){ X.save(); X.fillStyle='#FFFFFF'; X.fillRect(x-7,y-7,w+14,h+14); X.beginPath(); X.rect(x,y,w,h); X.clip(); const sc=zoom*w/im.width, iw=im.width*sc, ih=im.height*sc; X.drawImage(im,x+w/2-fx*iw,y+h/2-fy*ih,iw,ih); X.restore(); }
const BEAK={pink:[0.47,0.62],blue:[0.46,0.62],bluefull:[0.47,0.6],violet:[0.62,0.62],green:[0.47,0.58],clear:[0.45,0.5],redfull:[0.55,0.6],'p_أخضر':[0.3,0.68],'p_أصفرر':[0.42,0.63],'p_أمارانث':[0.53,0.6],'p_أصفر':[0.34,0.63]};
function bigStretch(word,y,size){ X.save(); X.lineJoin='round'; X.textAlign='center'; X.textBaseline='middle'; X.direction='rtl'; const s=kash(word,3), f=fit(s,size,900); X.font='900 '+f+'px '+FONT;
  X.strokeStyle='#FFFFFF'; X.lineWidth=f*0.11; X.shadowColor='rgba(14,21,36,0.55)'; X.shadowBlur=30; X.strokeText(s,540,y); X.shadowColor='transparent'; X.fillStyle=dyeGrad(140,940); X.fillText(s,540,y); X.restore(); }
/* ═══ أغلفة الأصباغ v2 — لغة احترافية موحّدة ═══
   ماكرو سينمائي من 4K + تدرّج لوني وفينييت · عنوان تحريري ضخم محاذي يمين (هامش 80) بكلمة مُبرزة بكتلة صلبة ·
   توقيع موحّد داخل قصّ 4:5 (y ≤ 1600): كتلة «المراسيل» بنفسجية + @almaraseel · النص من السكربت فقط */
const XR=1000;                                                              // حافة المحاذاة اليمنى
function vignette(a){ const g=X.createRadialGradient(540,960,420,540,960,1250); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(8,10,22,${a})`); X.fillStyle=g; X.fillRect(0,0,1080,1920); }
function topShade(a){ vgrad([[0,rgba(NAVY,a)],[0.42,rgba(NAVY,a*0.35)],[0.6,rgba(NAVY,0)]],0,1920); }
function botShade(a){ vgrad([[0,rgba(NAVY,0)],[0.68,rgba(NAVY,0)],[0.84,rgba(NAVY,a*0.7)],[1,rgba(NAVY,a)]],0,1920); }
/* سطر عنوان محاذي يمين بظل عميق (بلا حدّ سميك) */
function hl(s,y,fs,c){ X.save(); X.font='900 '+fs+'px '+FONT; X.textAlign='right'; X.textBaseline='middle'; X.direction='rtl'; X.shadowColor='rgba(6,8,20,0.75)'; X.shadowBlur=fs*0.35; X.shadowOffsetY=fs*0.06; X.fillStyle=c||'#FFFFFF'; X.fillText(ISO(s),XR,y); X.restore(); return tw(s,fs); }
/* كلمة مُبرزة داخل كتلة صلبة (فلات) */
function hlBlock(s,y,fs,bg,c){ const w=tw(s,fs)+fs*0.6, h=fs*1.32; X.fillStyle=bg; X.fillRect(XR-w+fs*0.3,y-h/2,w,h); X.save(); X.font='900 '+fs+'px '+FONT; X.textAlign='right'; X.textBaseline='middle'; X.direction='rtl'; X.fillStyle=c; X.fillText(ISO(s),XR,y+fs*0.04); X.restore(); return w; }
/* التوقيع الموحّد (داخل 4:5) */
function sign(dark){ const y=1528, s='المراسيل', fs=50, w=tw(s,fs)+56; X.fillStyle=PURP; X.fillRect(XR-w+28,y-38,w,76); txt(s,XR-w/2+28,y+2,fs,{c:'#FFFFFF'});
  X.save(); X.font='900 30px '+FONT; X.direction='ltr'; X.textAlign='left'; X.textBaseline='middle'; X.fillStyle=dark?NAVY:'#FFFFFF'; X.shadowColor=dark?'transparent':'rgba(6,8,20,0.7)'; X.shadowBlur=10; X.fillText('@almaraseel',80,y+2); X.restore(); }
function macro(k,fx,fy,z,ay){ photoZ(IMG[k],fx,fy,z,540,ay||980); }
/* ═══ أغلفة الأصباغ v3 — 25 غلاف · منطقتين ثابتتين داخل قصّ 4:5 ═══
   ① منطقة المحتوى y 300–1240: عنوان تحريري محاذي يمين (x=1000) + بطل الصورة · ② لوح التذييل الصلب y 1250–1630 (بلا تدرّج):
   «المراسيل» + التعريف · الأرقام (واتساب حقيقي) · السوشيال + الموقع · شريط العنوان بلونين — نفس مكوّنات K07 المعتمدة.
   النص من السكربت (والأسماء «الصبغ الباودر/المائي» من صاحب الشغل) فقط. */
const FY=1250;
function scaled(cx,cy,s,fn){ X.save(); X.translate(cx,cy); X.scale(s,s); X.translate(-cx,-cy); fn(); X.restore(); }
function footer(){ X.fillStyle=NAVY; X.fillRect(0,FY,1080,1920-FY); X.fillStyle=YEL; X.fillRect(0,FY,1080,6);
  txt('المراسيل',540,FY+64,74,{c:'#FFFFFF'}); const tg='لتجارة المواد الأولية للمنظفات', w=tw(tg,27); txt(tg,540,FY+122,27,{c:'rgba(255,255,255,0.9)'});
  X.fillStyle='rgba(255,255,255,0.7)'; X.fillRect(540-w/2-20-44,FY+121,44,2); X.fillRect(540+w/2+20,FY+121,44,2);
